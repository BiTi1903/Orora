<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <!-- Fetch first-screen CMS content before the React/Firebase bundle finishes. -->
  <script>
    window.__ororaEnteredAt = Date.now();
    if (location.pathname === '/') {
      window.__ororaShellPromise = fetch('/api/storefront-shell').then(function (response) {
        if (!response.ok) return null;
        return response.json();
      }).then(function (value) {
        if (!value || !value.content) return null;
        var image = value.images && (matchMedia('(max-width: 600px)').matches ? value.images.mobile : value.images.desktop);
        if (!window.__ororaLiveHomeReady && typeof image === 'string' && /^(https?:\/\/|\/(?!\/))/.test(image)) {
          var link = document.createElement('link');
          link.rel = 'preload'; link.as = 'image'; link.href = image; link.fetchPriority = 'high';
          var candidates = matchMedia('(max-width: 600px)').matches ? value.images.mobileSrcSet : value.images.desktopSrcSet;
          if (typeof candidates === 'string') { link.imageSrcset = candidates; link.imageSizes = '100vw'; }
          document.head.appendChild(link);
        }
        return value.content;
      }).catch(function () { return null; });
    }
  </script>
